<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Gestión LYM</title>
  
  <!-- ==========================================
       MÓDULO: ESTILOS (CSS CONFIGURABLE Y CAPAS MODERNIZADAS)
       ========================================== -->
  <style>
    :root {
      /* COLORES PRINCIPALES */
      --color-fondo: #f4f6f9;
      --color-panel: #ffffff;
      --color-primario: #0056b3;
      --color-primario-hover: #004494;
      --color-exito: #28a745;
      --color-peligro: #dc3545;
      --color-texto: #333333;
      --color-borde: #dce2e6;
      --color-sombra: rgba(0, 86, 179, 0.08);
      
      /* MEDIDAS Y FORMATOS */
      --radio-borde: 10px;
      --espaciado-panel: 25px;
      --tamano-fuente-base: 15px;
      --fuente-familia: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      --ancho-max-login: 420px;
      --ancho-max-app: 1250px;
    }

    body {
      font-family: var(--fuente-familia);
      background-color: var(--color-fondo);
      color: var(--color-texto);
      margin: 0; padding: 0;
      font-size: var(--tamano-fuente-base);
    }

    /* CAPAS / PANELS MÁS VISIBLES Y DEFINIDOS */
    .panel {
      background-color: var(--color-panel);
      padding: var(--espaciado-panel);
      border-radius: var(--radio-borde);
      border: 1px solid var(--color-borde);
      box-shadow: 0 6px 18px var(--color-sombra);
      margin: 20px auto;
      transition: all 0.3s ease;
    }

    input[type="text"], input[type="password"], input[type="number"], select, input[type="file"] {
      width: 100%; padding: 10px 12px; margin: 6px 0 14px;
      border: 1px solid #c4cdd5;
      border-radius: 6px;
      box-sizing: border-box;
      background-color: #fafbfc;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--color-primario);
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.15);
      background-color: #fff;
    }

    .btn {
      background-color: var(--color-primario); color: white;
      padding: 10px 20px; border: none; border-radius: 6px;
      cursor: pointer; font-weight: bold; transition: background 0.3s, transform 0.1s;
      display: inline-block; text-align: center;
    }
    .btn:hover { background-color: var(--color-primario-hover); }
    .btn:active { transform: scale(0.98); }
    .btn-salir { background-color: var(--color-peligro); float: right;}
    .btn-accion { background-color: var(--color-exito); width: 100%; margin-top: 10px; padding: 12px;}
    .btn-secundario { background-color: #6c757d; margin-top: 10px; }

    /* TABLAS ESTILIZADAS */
    table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; border-radius: 8px; overflow: hidden; border: 1px solid var(--color-borde); }
    th, td { border-bottom: 1px solid var(--color-borde); border-right: 1px solid var(--color-borde); padding: 10px; text-align: left; font-size: 14px; }
    th { background-color: var(--color-primario); color: white; font-weight: 600; text-transform: uppercase; font-size: 13px; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background-color: #f8fafc; }

    #app-container { display: none; max-width: var(--ancho-max-app); margin: 0 auto; padding: 20px; }
    #login-container { max-width: var(--ancho-max-login); margin: 80px auto; }
    
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid var(--color-borde); padding-bottom: 8px;}
    .tab { cursor: pointer; padding: 10px 18px; border-radius: 6px 6px 0 0; background: #e9ecef; font-weight: 600; color: #495057; transition: all 0.2s;}
    .tab.active { background: var(--color-primario); color: white; }
    .tab:hover:not(.active) { background: #dee2e6; }
    
    .seccion { display: none; }
    .seccion.active { display: block; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .logo-empresa {
      display: block;
      margin: 0 auto 15px auto;
      max-width: 140px;
      height: auto;
      object-fit: contain;
    }

    /* ESTILOS DE CALCULADORA */
    .calc-table input { margin: 0; padding: 6px; font-size: 13px; }
    .calc-table td { padding: 5px; }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #eef4fc;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #b8daff;
      margin-bottom: 15px;
      grid-column: span 2;
    }
    .checkbox-container input { width: auto; margin: 0; cursor: pointer; }
    .btn-ver-foto { background-color: #17a2b8; color: white; padding: 4px 8px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- VISTA 1: INGRESO -->
  <div id="login-container" class="panel">
    <img src="LYM2.png" alt="Logo Empresa" class="logo-empresa">
    <h2 style="text-align: center; color: var(--color-primario); margin-top: 0;">ACCESO DE SISTEMA</h2>
    <form id="form-login" autocomplete="off" onsubmit="event.preventDefault(); iniciarSesion();">
      <label>Usuario:</label>
      <input type="text" id="user" required>
      <label>Contraseña:</label>
      <input type="password" id="pass" required>
      <button type="submit" class="btn" style="width: 100%;">Ingresar</button>
      <p id="msg-login" style="color: var(--color-peligro); text-align: center; font-weight: bold;"></p>
    </form>
  </div>

  <!-- VISTA 2: APLICACIÓN -->
  <div id="app-container">
    <button class="btn btn-salir" onclick="cerrarSesion()">Cerrar Sesión</button>
    <img src="LYM2.png" alt="Logo Empresa" class="logo-empresa" style="margin: 0 15px 20px 0; float: left; max-width: 80px;">
    
    <h2 style="clear: right; color: var(--color-primario);">Consola de Administración</h2>
    
    <!-- PESTAÑAS NAVEGACIÓN -->
    <div class="nav-tabs" id="main-nav-tabs">
      <div class="tab" id="tab-calc" onclick="cambiarPestana('calculadora')">Calculadora</div>
      <div class="tab active" id="tab-busq" onclick="cambiarPestana('buscador')">Buscador</div>
      <div class="tab" id="tab-ing" onclick="cambiarPestana('ingresos')">Registrar Ingreso</div>
      <div class="tab" id="tab-sal" onclick="cambiarPestana('salidas')">Registrar Salida</div>
    </div>

    <!-- SECCIÓN 0: CALCULADORA -->
    <div id="sec-calculadora" class="seccion panel">
      <h3>Calculadora de Regla de Tres y Costos</h3>
      <div style="overflow-x: auto;">
        <table class="calc-table">
          <thead>
            <tr>
              <th>Precio ($)</th>
              <th>Factor In.</th>
              <th>Factor Fin.</th>
              <th>%</th>
              <th>Piezas</th>
              <th>Factura</th>
              <th>Con %</th>
              <th>Subtotal</th>
              <th>Precio Total</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="calc-body">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>
      <button class="btn btn-secundario" onclick="agregarFilaCalculadora()">+ Agregar Fila</button>
    </div>

    <!-- SECCIÓN 1: BUSCADOR -->
    <div id="sec-buscador" class="seccion active panel">
      <h3>Buscar Información</h3>
      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        
        <!-- NUEVO: SELECCIÓN DE HOJA -->
        <select id="busq-hoja" style="flex: 1; min-width: 130px; background-color: #eef4fc; border-color: var(--color-primario);">
          <option value="Inventario">Inventario</option>
          <option value="Entradas">Entradas</option>
          <option value="Salidas">Salidas</option>
        </select>

        <input type="text" id="busq-texto" placeholder="Buscar producto (Mín. 3 letras)..." style="flex: 2; min-width: 200px;">
        
        <select id="busq-general" style="flex: 1; min-width: 150px;">
          <option value="TODO">Búsqueda en todo</option>
          <option value="Espuma">Espuma</option>
          <option value="Barniz">Barniz</option>
          <option value="Madera">Madera</option>
          <option value="Herrajes">Herrajes</option>
          <option value="Lijas">Lijas</option>
          <option value="Empaque">Empaque</option>
          <option value="Telas">Telas</option>
          <option value="Estructuras">Estructuras</option>
          <option value="Otro">Otro</option>
        </select>
        
        <select id="busq-especifica" style="flex: 1; min-width: 150px;">
          <option value="">Sin filtro específico</option>
          <option value="MEDIDAS">Grosor / Medidas</option>
          <option value="DENSIDAD">Densidad</option>
        </select>
        
        <select id="busq-val-especifico" style="display:none; flex: 1; min-width: 150px;"></select>
        
        <button class="btn" onclick="ejecutarBusqueda()">Buscar</button>
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead><tr id="tabla-head"></tr></thead>
          <tbody id="tabla-body"></tbody>
        </table>
      </div>
    </div>

    <!-- SECCIÓN 2: INGRESOS -->
    <div id="sec-ingresos" class="seccion panel">
      <h3>Registro de Ingresos</h3>
      
      <div class="checkbox-container">
        <input type="checkbox" id="ing-chk-solo-desc" onchange="toggleEdicionDescripcion()">
        <label for="ing-chk-solo-desc"><strong>Editar únicamente la descripción de un producto existente</strong></label>
      </div>

      <form id="form-ingresos">
        <div class="form-grid">
          <div>
            <label>Nombre/Producto:</label>
            <input type="text" id="ing-nombre" list="lista-inventario" onchange="verificarSiExiste('ing')" required placeholder="Seleccione o escriba...">
            <small id="ing-aviso"></small>
          </div>
          <div>
            <label>Tipo:</label>
            <!-- REEMPLAZADO POR DATALIST -->
            <input type="text" id="ing-tipo" list="lista-tipos" class="ing-req" required placeholder="Seleccione o escriba...">
            <datalist id="lista-tipos">
              <option value="Espuma">
              <option value="Barniz">
              <option value="Madera">
              <option value="Herrajes">
              <option value="Lijas">
              <option value="Empaque">
              <option value="Telas">
              <option value="Estructuras">
              <option value="Otro">
            </datalist>
          </div>
          <div>
            <label>Unidad de Medida:</label>
            <input type="text" id="ing-unidad" list="lista-unidades" class="ing-req" required placeholder="Seleccione o escriba...">
            <datalist id="lista-unidades"></datalist>
          </div>
          <div>
            <label>Grosor:</label>
            <input type="text" id="ing-medidas" list="lista-medidas" placeholder="Seleccione o escriba...">
            <datalist id="lista-medidas"></datalist>
          </div>
          <div>
            <label>Densidad:</label>
            <input type="text" id="ing-densidad" list="lista-densidades" placeholder="Seleccione o escriba...">
            <datalist id="lista-densidades"></datalist>
          </div>
          <div>
            <label>Cantidad:</label>
            <input type="number" step="0.01" id="ing-cantidad" class="ing-req" required oninput="calcularTotal('ing')">
          </div>
          <div>
            <label>Precio ($):</label>
            <input type="number" step="0.01" id="ing-precio" class="ing-req" required oninput="calcularTotal('ing')">
          </div>
          <div>
            <label>Total ($):</label>
            <input type="number" id="ing-total" readonly>
          </div>
          <div>
            <label>Proveedor:</label>
            <input type="text" id="ing-proveedor" list="lista-proveedores" placeholder="Seleccione o escriba...">
            <datalist id="lista-proveedores"></datalist>
          </div>
          <div>
            <label>Entregó a:</label>
            <select id="ing-entregoa" class="ing-req" required></select>
          </div>
          <div style="grid-column: span 2;">
            <label>Descripción:</label>
            <input type="text" id="ing-descripcion">
          </div>
          <div style="grid-column: span 2;">
            <label>Fotografía del producto (Opcional):</label>
            <input type="file" id="ing-foto" accept="image/*" capture="environment" onchange="procesarFoto(this, 'ing-foto-data')">
            <input type="hidden" id="ing-foto-data">
          </div>
        </div>
        <button type="button" id="btn-guardar-ing" class="btn btn-accion" onclick="guardarTransaccion('INGRESO')">Registrar Ingreso</button>
      </form>
    </div>

    <!-- SECCIÓN 3: SALIDAS -->
    <div id="sec-salidas" class="seccion panel">
      <h3>Registro de Salidas</h3>
      <form id="form-salidas">
        <div class="form-grid">
          <div style="grid-column: span 2;">
            <label>Producto:</label>
            <input type="text" id="sal-nombre" list="lista-inventario" onchange="cargarDatosSalida()" required>
          </div>
          <div>
            <label>Tipo:</label>
            <input type="text" id="sal-tipo" readonly style="background:#e9ecef;">
          </div>
          <div>
            <label>Unidad de Medida:</label>
            <input type="text" id="sal-unidad" readonly style="background:#e9ecef;">
          </div>
          <div>
            <label>Cantidad a Sacar:</label>
            <input type="number" step="0.01" id="sal-cantidad" required>
          </div>
          <div>
            <label>Tipo de Asignación:</label>
            <select id="sal-tipo-asig" onchange="toggleTipoAsignacion()" required>
              <option value="Orden de Producción">Orden de Producción</option>
              <option value="Asignación">Asignación</option>
              <option value="Préstamo">Préstamo</option>
            </select>
          </div>
          <div id="div-sal-orden">
            <label>No. Orden de Producción:</label>
            <input type="text" id="sal-orden" placeholder="Escriba la orden...">
          </div>
          <div>
            <label>Se entrega a:</label>
            <select id="sal-entregoa" required></select>
          </div>
          <div style="grid-column: span 2;">
            <label>Descripción / Notas:</label>
            <input type="text" id="sal-descripcion">
          </div>
          <div style="grid-column: span 2;">
            <label>Fotografía de la Salida (Opcional):</label>
            <input type="file" id="sal-foto" accept="image/*" capture="environment" onchange="procesarFoto(this, 'sal-foto-data')">
            <input type="hidden" id="sal-foto-data">
          </div>
        </div>
        <button type="button" class="btn btn-accion" onclick="guardarTransaccion('SALIDA')">Registrar Salida</button>
      </form>
    </div>

    <datalist id="lista-inventario"></datalist>
  </div>

  <!-- ==========================================
       MÓDULO: ENLACE Y LÓGICA DE CONTROL (JS)
       ========================================== -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0lrN1OBnDDGaxoxucUAvdm20tdjsupg4trwSezy0oqvoHYFfFjlli566IVxib8LfgWQ/exec";

    let timerInactividad;
    const TIEMPO_EXPIRACION = 3600000; // 1 hora
    let datosCargados = {};
    let usuarioActual = null;

    async function ejecutarPeticionAPI(action, data = {}) {
      try {
        let respuesta = await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, data: data })
        });
        return await respuesta.json();
      } catch (error) {
        console.error("Error en API:", error);
        return { success: false, message: "Error al conectar con la base de datos distribuida." };
      }
    }

    // LISTENER PARA CONTROLAR EL DESPLEGABLE DE BÚSQUEDA ESPECÍFICA
    document.getElementById('busq-especifica').addEventListener('change', function() {
      let selectVal = document.getElementById('busq-val-especifico');
      let filtro = this.value;
      selectVal.innerHTML = '';
      
      if (!filtro) {
        selectVal.style.display = 'none';
        return;
      }
      
      let fuenteValores = (filtro === 'MEDIDAS') ? datosCargados.medidas : datosCargados.densidades;
      let opcionesHTML = ['<option value="">Selecciona valor...</option>'];
      (fuenteValores || []).forEach(valor => {
        opcionesHTML.push(`<option value="${valor}">${valor}</option>`);
      });
      
      selectVal.innerHTML = opcionesHTML.join('');
      selectVal.style.display = 'block';
    });

    // CONTROL INACTIVIDAD
    function resetTimer() {
      clearTimeout(timerInactividad);
      if (document.getElementById('app-container').style.display === 'block') {
        timerInactividad = setTimeout(cerrarSesion, TIEMPO_EXPIRACION);
      }
    }
    window.onload = function() {
      resetTimer();
      agregarFilaCalculadora();
    }; 
    document.onmousemove = resetTimer; 
    document.onkeypress = resetTimer;

    // LOGIN CON CONTROL DE ROLES
    async function iniciarSesion() {
      let u = document.getElementById('user').value;
      let p = document.getElementById('pass').value;
      document.getElementById('msg-login').innerText = "Validando credenciales...";
      
      let res = await ejecutarPeticionAPI('loginUsuario', { usuario: u, password: p });
      
      if (res.success) {
        usuarioActual = res.user;
        document.getElementById('form-login').reset();
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        
        aplicarPermisosPorRol(usuarioActual.rol);
        cargarDatosMaestros();
        resetTimer();
      } else {
        document.getElementById('msg-login').innerText = res.message;
      }
    }

    function aplicarPermisosPorRol(rol) {
      let esAdmin = (rol && rol.toString().toLowerCase() === 'admin');
      
      // Admin ve todo; User solo ve módulo de Buscador
      document.getElementById('tab-calc').style.display = esAdmin ? 'block' : 'none';
      document.getElementById('tab-ing').style.display = esAdmin ? 'block' : 'none';
      document.getElementById('tab-sal').style.display = esAdmin ? 'block' : 'none';

      cambiarPestana('buscador');
    }

    function cerrarSesion() {
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('login-container').style.display = 'block';
      document.getElementById('msg-login').innerText = "Sesión cerrada de forma segura.";
      document.getElementById('form-ingresos').reset();
      document.getElementById('form-salidas').reset();
      document.getElementById('busq-texto').value = '';
      document.getElementById('busq-especifica').value = '';
      document.getElementById('busq-val-especifico').style.display = 'none';
      document.getElementById('tabla-head').innerHTML = '';
      document.getElementById('tabla-body').innerHTML = '';
      clearTimeout(timerInactividad);
    }

    function cambiarPestana(id) {
      document.querySelectorAll('.seccion').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      
      let sec = document.getElementById('sec-' + id);
      let tab = document.getElementById('tab-' + (id.substring(0,3)));
      if (sec) sec.classList.add('active');
      if (tab) tab.classList.add('active');
    }

    // CARGA DE LISTAS DESPLEGABLES DINÁMICAS (AHORA COMO DATALIST)
    async function cargarDatosMaestros() {
      let res = await ejecutarPeticionAPI('obtenerDatosFormularios');
      datosCargados = res;
      
      // Auto-completar Datalist Inventario
      let dl = document.getElementById('lista-inventario');
      dl.innerHTML = '';
      (res.inventario || []).forEach(item => {
        let opt = document.createElement('option'); 
        opt.value = item.nombre; 
        dl.appendChild(opt);
      });

      // Llenar nuevos Datalists en lugar de selects
      llenarDatalist('lista-unidades', res.unidades || []);
      llenarDatalist('lista-medidas', res.medidas || []);
      llenarDatalist('lista-densidades', res.densidades || []);
      llenarDatalist('lista-proveedores', res.proveedores || []);

      // Llenar Personal RH (Se mantiene como Select porque tiene "Optgroups")
      let optionsRH = '<option value="">Seleccione...</option><optgroup label="Áreas">';
      (res.areas || []).forEach(a => optionsRH += `<option value="${a}">${a}</option>`);
      optionsRH += '</optgroup><optgroup label="Personal">';
      (res.personal || []).forEach(p => optionsRH += `<option value="${p}">${p}</option>`);
      optionsRH += '</optgroup>';
      
      document.getElementById('ing-entregoa').innerHTML = optionsRH;
      document.getElementById('sal-entregoa').innerHTML = optionsRH;
    }

    // Función auxiliar para llenar <datalist>
    function llenarDatalist(idElem, lista) {
      let el = document.getElementById(idElem);
      if(!el) return;
      let html = '';
      lista.forEach(val => html += `<option value="${val}">`);
      el.innerHTML = html;
    }

    // MÓDULO CALCULADORA
    function agregarFilaCalculadora() {
      let tbody = document.getElementById('calc-body');
      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="number" step="0.01" class="c-a" placeholder="Pesos" oninput="calcularCalculadora(this)"></td>
        <td><input type="number" step="0.0001" class="c-b" placeholder="Dec" oninput="calcularCalculadora(this)"></td>
        <td><input type="number" step="0.0001" class="c-c" placeholder="Dec" oninput="calcularCalculadora(this)"></td>
        <td><input type="number" step="0.01" class="c-d" placeholder="%" oninput="calcularCalculadora(this)"></td>
        <td><input type="number" step="1" class="c-e" placeholder="Entero" oninput="calcularCalculadora(this)"></td>
        <td><input type="number" class="c-f" readonly style="background:#e9ecef;"></td>
        <td><input type="number" class="c-g" readonly style="background:#e9ecef;"></td>
        <td><input type="number" class="c-h" readonly style="background:#e9ecef;"></td>
        <td><input type="number" class="c-i" readonly style="background:#e9ecef; font-weight:bold;"></td>
        <td><button class="btn btn-salir" style="padding:4px 8px; margin:0;" onclick="this.closest('tr').remove()">X</button></td>
      `;
      tbody.appendChild(tr);
    }

    function calcularCalculadora(elem) {
      let tr = elem.closest('tr');
      let a = parseFloat(tr.querySelector('.c-a').value) || 0;
      let b = parseFloat(tr.querySelector('.c-b').value) || 0;
      let c = parseFloat(tr.querySelector('.c-c').value) || 0;
      let d = parseFloat(tr.querySelector('.c-d').value) || 0;
      let e = parseFloat(tr.querySelector('.c-e').value) || 0;

      // Columna 6 (Factura) = (A * C) / B
      let f = (b !== 0) ? (a * c) / b : 0;
      // Columna 7 (Con %) = Columna 6 * (Porcentaje / 100)
      let g = f * (d / 100);
      // Columna 8 (Subtotal) = Columna 6 + Columna 7
      let h = f + g;
      // Columna 9 (Total) = Columna 8 * Piezas (Columna 5)
      let i = h * e;

      tr.querySelector('.c-f').value = f.toFixed(2);
      tr.querySelector('.c-g').value = g.toFixed(2);
      tr.querySelector('.c-h').value = h.toFixed(2);
      tr.querySelector('.c-i').value = i.toFixed(2);
    }

    // BUSCADOR MEJORADO (CON BÚSQUEDA DINÁMICA DE FOTOS Y SELECCIÓN DE HOJA)
    async function ejecutarBusqueda() {
      let texto = document.getElementById('busq-texto').value;
      if (texto.length < 3) { alert("Ingresa mínimo 3 letras."); return; }

      document.getElementById('tabla-body').innerHTML = '<tr><td>Buscando en la base de datos...</td></tr>';
      
      let res = await ejecutarPeticionAPI('buscarEnInventario', {
        texto: texto,
        hoja: document.getElementById('busq-hoja').value, // <--- SE ENVÍA EL DATO DE LA HOJA
        filtroGeneral: document.getElementById('busq-general').value,
        filtroEspecifico: document.getElementById('busq-especifica').value,
        valorEspecifico: document.getElementById('busq-val-especifico').value
      });

      let thead = ''; (res.cabeceras || []).forEach(c => thead += `<th>${c}</th>`);
      thead += '<th>Fotografía</th>';
      document.getElementById('tabla-head').innerHTML = thead;
      
      let tbody = '';
      if (!res.data || res.data.length === 0) { 
        tbody = '<tr><td colspan="15">Sin coincidencias en esta hoja</td></tr>'; 
      } else {
        res.data.forEach(f => {
          tbody += '<tr>';
          
          let fotoUrl = ''; 
          
          // Detección dinámica: buscamos celda por celda si contiene un enlace de Google Drive
          f.forEach((c, idx) => {
            let valorCelda = c ? c.toString() : '';
            if (valorCelda.startsWith('http')) {
                fotoUrl = valorCelda; // Atrapamos el link de la foto sin importar en qué columna esté
                tbody += `<td><small style="color:#888;">[Link Adjunto]</small></td>`;
            } else {
                tbody += `<td>${valorCelda.includes('GMT') ? new Date(c).toLocaleDateString() : valorCelda}</td>`;
            }
          });
          
          // Renderizamos el botón al final de la fila si encontramos el enlace
          if (fotoUrl) {
            tbody += `<td><a href="${fotoUrl}" target="_blank" class="btn-ver-foto">Ver Foto</a></td>`;
          } else {
            tbody += `<td><small style="color:#888;">Sin foto</small></td>`;
          }
          tbody += '</tr>';
        });
      }
      document.getElementById('tabla-body').innerHTML = tbody;
    }

    // OPCIÓN: EDITAR ÚNICAMENTE DESCRIPCIÓN
    function toggleEdicionDescripcion() {
      let chk = document.getElementById('ing-chk-solo-desc').checked;
      let reqInputs = document.querySelectorAll('.ing-req');
      let btn = document.getElementById('btn-guardar-ing');
// --- MODIFICACIÓN: Bloquear/Desbloquear Total y Proveedor ---
  let inputTotal = document.getElementById('ing-precio');         // Asegúrate de que este sea el ID de tu input total
  let inputProveedor = document.getElementById('ing-proveedor'); // Asegúrate de que este sea el ID de tu input proveedor
let inputmedidas = document.getElementById('ing-medidas'); // Asegúrate de que este sea el ID de tu input proveedor
     let inputdensidad = document.getElementById('ing-densidad'); // Asegúrate de que este sea el ID de tu input proveedor

        i.required = !chk;

      });

    function verificarSiExiste(prefijo) {
      let val = document.getElementById(prefijo + '-nombre').value;
      let item = (datosCargados.inventario || []).find(i => i.nombre.toLowerCase() === val.toLowerCase());
      
      if (prefijo === 'ing') {
        let aviso = document.getElementById('ing-aviso');
        aviso.innerText = item ? "Producto EXISTENTE: Se sumará al stock." : "NUEVO PRODUCTO: Se creará en almacén.";
        aviso.style.color = item ? "var(--color-primario)" : "var(--color-exito)";

        // Auto-completar datos si existe
        if(item) {
          if(item.tipo) document.getElementById('ing-tipo').value = item.tipo;
          if(item.unidad) document.getElementById('ing-unidad').value = item.unidad;
          if(item.medidas) document.getElementById('ing-medidas').value = item.medidas;
          if(item.densidad) document.getElementById('ing-densidad').value = item.densidad;
        }
      }
    }

    function cargarDatosSalida() {
      let nombre = document.getElementById('sal-nombre').value;
      let item = (datosCargados.inventario || []).find(i => i.nombre.toLowerCase() === nombre.toLowerCase());
      
      if (item) {
        document.getElementById('sal-tipo').value = item.tipo || '';
        document.getElementById('sal-unidad').value = item.unidad || '';
      } else {
        alert("El producto no existe en el inventario.");
        document.getElementById('sal-nombre').value = '';
        document.getElementById('sal-tipo').value = '';
        document.getElementById('sal-unidad').value = '';
      }
    }

    function toggleTipoAsignacion() {
      let val = document.getElementById('sal-tipo-asig').value;
      let divOrden = document.getElementById('div-sal-orden');
      let inputOrden = document.getElementById('sal-orden');
      
      if (val === 'Orden de Producción') {
        divOrden.style.display = 'block';
        inputOrden.required = true;
      } else {
        divOrden.style.display = 'none';
        inputOrden.required = false;
        inputOrden.value = '';
      }
    }

    function calcularTotal(prefijo) {
      let c = parseFloat(document.getElementById(prefijo + '-cantidad').value) || 0;
      let p = parseFloat(document.getElementById(prefijo + '-precio').value) || 0;
      document.getElementById(prefijo + '-total').value = (c * p).toFixed(2);
    }

    // PROCESAMIENTO DE IMÁGENES A BASE64
    function procesarFoto(inputElem, targetId) {
      if (inputElem.files && inputElem.files[0]) {
        let reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById(targetId).value = e.target.result;
        };
        reader.readAsDataURL(inputElem.files[0]);
      }
    }

    // TRANSACCIONES (INGRESO / SALIDA)
    async function guardarTransaccion(tipoTx) {
      let prefijo = tipoTx === 'INGRESO' ? 'ing' : 'sal';
      let nombre = document.getElementById(prefijo + '-nombre').value;
      if (!nombre) return alert("El nombre del producto es obligatorio.");

      let soloDesc = (tipoTx === 'INGRESO') && document.getElementById('ing-chk-solo-desc').checked;

      let datos = {
        tipo: document.getElementById(prefijo + '-tipo') ? document.getElementById(prefijo + '-tipo').value : '',
        movimiento: tipoTx, 
        nombre: nombre,
        unidad: document.getElementById(prefijo + '-unidad') ? document.getElementById(prefijo + '-unidad').value : '',
        medidas: document.getElementById(prefijo + '-medidas') ? document.getElementById(prefijo + '-medidas').value : '',
        densidad: document.getElementById(prefijo + '-densidad') ? document.getElementById(prefijo + '-densidad').value : '',
        cantidad: document.getElementById(prefijo + '-cantidad') ? document.getElementById(prefijo + '-cantidad').value : 0,
        precio: document.getElementById(prefijo + '-precio') ? document.getElementById(prefijo + '-precio').value : 0,
        total: document.getElementById(prefijo + '-total') ? document.getElementById(prefijo + '-total').value : 0,
        proveedor: document.getElementById(prefijo + '-proveedor') ? document.getElementById(prefijo + '-proveedor').value : '',
        descripcion: document.getElementById(prefijo + '-descripcion').value || '',
        entregoA: document.getElementById(prefijo + '-entregoa').value,
        fotoData: document.getElementById(prefijo + '-foto-data').value || '',
        soloDescripcion: soloDesc,
        esNuevo: tipoTx === 'INGRESO' ? !(datosCargados.inventario || []).find(i => i.nombre.toLowerCase() === nombre.toLowerCase()) : false
      };

      if (tipoTx === 'SALIDA') {
        let tipoAsig = document.getElementById('sal-tipo-asig').value;
        datos.ordenProd = (tipoAsig === 'Orden de Producción') ? ('OP: ' + document.getElementById('sal-orden').value) : tipoAsig;
      }

      let btn = event.target; 
      btn.disabled = true;
      btn.innerText = "Procesando...";

      let res = await ejecutarPeticionAPI('procesarTransaccion', { tipoTx: tipoTx, datos: datos });
      
      btn.disabled = false;
      btn.innerText = tipoTx === 'INGRESO' ? (soloDesc ? "Actualizar Descripción Únicamente" : "Registrar Ingreso") : "Registrar Salida";
      
      alert(res.message);
      if (res.success) {
        document.getElementById('form-' + (tipoTx==='INGRESO'?'ingresos':'salidas')).reset();
        document.getElementById(prefijo + '-foto-data').value = '';
        if(document.getElementById('ing-aviso')) document.getElementById('ing-aviso').innerText = '';
        cargarDatosMaestros();
      }
    }
  </script>
